<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Bowling</title>

    <!-- Set --app-height for Android WebView + mobile -->
    <script>
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
      }
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', () => {
        setTimeout(setAppHeight, 100); // Allow Android WebView to settle
      });
      window.addEventListener('load', setAppHeight);
      setAppHeight(); // Call on initial load
    </script>

    <style>
      /* Basic fallback loader styling */
      #loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--app-height, 100vh);
        font-family: sans-serif;
        background: #111;
        color: white;
        font-size: 1.5rem;
      }
      button.retry {
        background: #fff;
        color: black;
        border: none;
        padding: 0.6rem 1rem;
        font-size: 1rem;
        margin-top: 1rem;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Initial fallback UI -->
    <div id="root">
      <div id="loading-screen">
        <p>Loading...</p>
      </div>
    </div>

    <!-- JS startup error fallback -->
    <script>
      window.addEventListener('error', function (event) {
        document.getElementById('root').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#300;color:white;text-align:center;">
            <h1>⚠ Oops!</h1>
            <p>Something went wrong loading Fantasy Bowling.</p>
            <button class="retry" onclick="location.reload()">Reload</button>
          </div>
        `;
      });
    </script>

    <!-- Main React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
